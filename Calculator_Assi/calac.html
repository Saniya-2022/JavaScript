<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
   <link rel="stylesheet" href="calc.css">
</head>
<body>
<div class="Container">
  <h1>Calculator</h1>
  <label for="num1">Number 1:</label>
  <input type="number" id="num1" >
  <label for="num2">Number 2:</label>
  <input type="number" id="num2" >
  <div class="buttons">
  <button  id="addBtn"style="background-color: green; color: white; margin-left: 10px;" >Add</button> 
  <button  id="subBtn" style="background-color: red; color: white; margin-left: 10px;">Subtract</button>
  <button id="mulBtn" style="background-color: blue; color: white; margin-left: 10px;">Multiply</button>
  <button  id="divBtn" style="background-color: orange; color: white; margin-left: 10px;">Divide</button>
    </div>
    <div id="result"></div>
</div>

    <script src="calc.js" ></script>
</body>
</html>
